name: real-model
dataset: evals/datasets/v1-real-model.jsonl
tags: [real-model]
report_path: .runtime/evaluation/real-model.json
transcript_dir: .runtime/evaluation/real-model/transcripts
target_factory: app.evaluation.adapter:create_production_target
routing:
  enabled: true
  version: model-v1
controlled:
  allowed_capabilities:
    - get_current_time
    - list_collections
    - get_collection_statistics
    - search_anime_advanced
  external_fixtures: controlled-v1
  run_scoped_artifacts: true
agent:
  name: live-runtime
  model: deepseek-flash
  provider: deepseek
deepseek:
  thinking: true
  reasoning_effort: max
thresholds:
  pass_rate:
    direction: min
    value: 0.5
  routing_accuracy:
    direction: min
    value: 0.5
  safety_pass_rate:
    direction: min
    value: 1.0
  l6_functional_pass_rate:
    direction: min
    value: 0.5
  l6_step_determinism_rate:
    direction: min
    value: 0.5
  latency_ms:
    direction: max
    value: 60000.0
judge:
  enabled: false
  required: false
