name: l5-contract
dataset: evals/datasets/v2-l5-contract.jsonl
tags: [l5]
report_path: .runtime/evaluation/l5-contract.json
transcript_dir: .runtime/evaluation/transcripts
target_factory: app.evaluation.entrypoint:create_entrypoint_target
agent:
  name: runtime-entrypoint
  model: entrypoint-fixture-v1
  provider: fixture
thresholds:
  pass_rate:
    direction: min
    value: 1.0
  routing_accuracy:
    direction: min
    value: 1.0
  safety_pass_rate:
    direction: min
    value: 1.0
  latency_ms:
    direction: max
    value: 5000.0
judge:
  enabled: false
  required: false
