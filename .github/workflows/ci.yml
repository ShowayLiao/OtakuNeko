name: CI

on:
  # Every pull request runs the gates regardless of its base branch: the
  # repository's default branch is release-1.0 while integration work happens on
  # feature-* branches, so a `main`-only filter meant CI never ran at all.
  pull_request:
  push:
    branches: [main, release-1.0]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: software
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Run backend lint
        run: uv run --locked ruff check app tests alembic scripts __init__.py

      - name: Enforce business-layer import boundaries
        run: uv run --locked ruff check --select TID251 app/services app/models app/repositories app/schemas

      # Fresh test-only key; never use a production credential in PR tests.
      - name: Set up isolated test environment
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEBUG=false" >> "$GITHUB_ENV"
          echo "ENABLE_QB_PROXY=false" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: |
          mkdir -p .runtime/junit
          uv run --locked pytest --junitxml=.runtime/junit/software.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-software-junit
          path: backend/.runtime/junit/software.xml
          if-no-files-found: warn

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: otakuneko_test
          POSTGRES_USER: otakuneko_test
          POSTGRES_PASSWORD: otakuneko_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otakuneko_test -d otakuneko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Set up isolated test environment
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEBUG=false" >> "$GITHUB_ENV"
          echo "ENABLE_QB_PROXY=false" >> "$GITHUB_ENV"

      - name: Run PostgreSQL tests
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://otakuneko_test:otakuneko_test_only@localhost:5432/otakuneko_test
        run: |
          mkdir -p .runtime/junit
          uv run --locked pytest --run-postgres -m postgres --junitxml=.runtime/junit/postgres.xml

      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-junit
          path: backend/.runtime/junit/postgres.xml
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check frontend formatting
        run: pnpm format:check
        working-directory: frontend

      - name: Run frontend lint
        run: pnpm lint
        working-directory: frontend

      - name: Run frontend typecheck
        run: pnpm typecheck
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm test
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

  backend-quality-baseline:
    name: backend-quality-baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Typecheck all backend source and tests against audited debt
        run: uv run --locked python scripts/check_type_baseline.py

      - name: Check backend dependency declarations
        run: uv run --locked deptry .

      - name: Check formatting across all backend Python code
        run: uv run --locked ruff format --check app tests alembic scripts __init__.py

  harness:
    name: harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --dev

      # API imports require JWT configuration even during test collection.
      - name: Set up isolated test environment
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENABLE_QB_PROXY=false" >> "$GITHUB_ENV"

      - name: Run deterministic Harness regression
        run: uv run --locked pytest tests/harness tests/acceptance tests/capabilities tests/trace -q

      - name: Lint Harness boundaries
        run: uv run --locked ruff check app/harness app/capabilities app/trace tests/harness tests/acceptance tests/capabilities tests/trace

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Run offline fast evaluation
        run: uv run --locked python -m app.evaluation.runner --config evals/config/fast.yaml

      - name: Upload offline evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-evaluation-report
          path: backend/.runtime/evaluation/fast.json
          if-no-files-found: error

  configuration:
    name: configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --dev
        working-directory: backend

      - name: Install verified actionlint 1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Record configuration validator versions
        run: |
          actionlint -version
          docker compose version

      - name: Validate configuration and tool rejection probes
        run: uv run --locked --directory backend python scripts/check_configuration_coverage.py --probe-tools

      - name: Verify configuration failure regressions
        run: uv run --locked --directory backend pytest tests/test_configuration.py tests/test_configuration_coverage.py -q

      - name: Upload configuration coverage and exit codes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configuration-coverage
          path: backend/.runtime/quality/configuration-coverage.json
          if-no-files-found: error

  repository-quality:
    name: repository-quality
    needs: [software, postgres, frontend, backend-quality-baseline, harness, benchmark, configuration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required gates
        env:
          SOFTWARE_RESULT: ${{ needs.software.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality-baseline.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
        run: |
          {
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo "| software | $SOFTWARE_RESULT |"
            echo "| postgres | $POSTGRES_RESULT |"
            echo "| frontend | $FRONTEND_RESULT |"
            echo "| backend-quality-baseline | $BACKEND_QUALITY_RESULT |"
            echo "| harness | $HARNESS_RESULT |"
            echo "| benchmark | $BENCHMARK_RESULT |"
            echo "| configuration | $CONFIGURATION_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$SOFTWARE_RESULT" "$POSTGRES_RESULT" "$FRONTEND_RESULT" "$BACKEND_QUALITY_RESULT" "$HARNESS_RESULT" "$BENCHMARK_RESULT" "$CONFIGURATION_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "A required gate did not succeed: $result" >&2
              exit 1
            fi
          done
